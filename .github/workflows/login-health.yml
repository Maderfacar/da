name: Login Health Check

# 為什麼需要這條 workflow：
#   Vercel Hobby 方案 cron 上限 2 條且已用滿（cleanup-error-logs / alert-auth-health），
#   而每日一次的偵測頻率不足以達成本變更的驗收標準（故障當天就要告警）。
#   因此改由 GitHub Actions 每小時打同一支端點（免費、無條數限制），視窗取 3h。
#
# ⚠️ 這裡原本寫著「重複觸發不會產生副作用」—— 那句話是錯的，而且付出過代價。
#   端點確實不改資料，但它越界時會**推播**，而推播就是副作用：LINE 每月額度按收件人計。
#   2026-08-24 乘客 OA 月額度被打爆（429），連客人的訂單通知一起發不出去，
#   來源正是「每日改每小時（24×）× 視窗重疊連報 3-4 次 × 3 位收件人」。
#   當時問的是「會不會改壞資料」（不會），然後讓那個答案代替了從沒問過的
#   「重複呼叫要花什麼」。**改動任何外部 API 的呼叫頻率前，先問這個服務有沒有配額或計費。**
#
# 現況：掃描維持每小時（早點發現），推播由 alert-dedup 的內容指紋去重（9eb0d8a），
#   且 admin 通知已改走 email（9a3be61），不再消耗 LINE 額度。
#   視窗重疊（每小時掃 3h）仍是刻意的 —— 重複的是偵測，不是推播。

on:
  schedule:
    - cron: '7 * * * *' # 每小時第 7 分（避開整點的 GitHub Actions 尖峰排隊）
  workflow_dispatch: # 允許手動觸發，供驗收使用

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 呼叫登入健康檢查端點
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT: https://da-line-liff-app.vercel.app/api/cron/alert-auth-health?hours=3
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::缺少 CRON_SECRET secret — 端點會回 401，偵測形同關閉。請於 repo Settings → Secrets 設定（值與 Vercel 環境變數相同）。"
            exit 1
          fi

          response=$(curl --silent --show-error --fail-with-body \
            --max-time 60 \
            --write-out '\n%{http_code}' \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$ENDPOINT") || {
            echo "::error::端點呼叫失敗"
            echo "$response"
            exit 1
          }

          status=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP $status"
          echo "$body"

          # 端點回 200 但 envelope 內含 401（未授權）時同樣視為失敗，避免靜默失效
          if echo "$body" | grep -q '"code":401'; then
            echo "::error::端點回報未授權 — CRON_SECRET 與 Vercel 環境變數不符"
            exit 1
          fi

      # 設定漂移偵測（config-contract-gate Phase C）：build gate 只在部署前跑，
      # 部署後有人改動 Vercel 環境變數就沒人知道。這一步每小時對 prod 實況重驗一次。
      - name: 檢查設定契約（prod 實況）
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT: https://da-line-liff-app.vercel.app/nuxt-api/_health/config
        run: |
          body=$(curl --silent --show-error --fail-with-body \
            --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$ENDPOINT") || {
            echo "::error::設定健檢端點呼叫失敗"
            echo "$body"
            exit 1
          }

          echo "$body"

          if echo "$body" | grep -q '"code":401'; then
            echo "::error::設定健檢回報未授權 — CRON_SECRET 不符"
            exit 1
          fi

          # fail-closed：端點在未設 CRON_SECRET 時拒絕輸出（見端點註解）
          if echo "$body" | grep -q '"code":503'; then
            echo "::error::prod 未設定 CRON_SECRET —— 健檢端點與所有 cron 端點目前皆無保護，請於 Vercel 環境變數設定"
            exit 1
          fi

          # 回應只含設定名稱與問題種類，不含值，可安全印在 Actions log
          if echo "$body" | grep -q '"ok":false'; then
            echo "::error::prod 設定有 error 級問題 —— 見上方 issues（level=error 者）"
            exit 1
          fi
