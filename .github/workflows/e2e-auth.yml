name: E2E Auth Matrix

# 風險覆蓋：Tier A（公開/受保護路由 + LIFF redirect guard）+ Tier B（cold/warm boot、role gate、
# 401 retry、lazy read timeout）共 10 個自動化場景。Tier C 4 場景由 Brain AI 手動驗收。
#
# 設計：
#   - 身分 mock 只靠 fixture 注入的 window.__E2E_MODE__；plugin 跳過 LIFF / Firebase init
#   - 所有 /nuxt-api/* request 由 fixture page.route 攔截，不打真實後端
#   - 不需要任何 Firebase / LINE / Google Maps secret
#
# 2026-08-29 修正（這條 workflow 自 2026-06-25 建立起 32 次執行 0 次成功）：
#   a. **不再設 NUXT_PUBLIC_TEST_MODE=T**。它不只 auth plugin 在看 ——
#      app/protocol/fetch-api/api/{order,auth,file}/index.ts 的 IsMock() 也看它，為 T 時整層
#      API 回罐頭資料、完全不發請求，fixture 的 page.route 全部形同虛設。
#   b. **裝 webkit**。playwright.config 有三個 project，iphone-14 走 WebKit；
#      原本只裝 chromium，那個 project 連瀏覽器都起不來。
#   c. **對 production build 跑**，與本地、與視覺基線同一種產物（dev 的 vite-node 會 IPC
#      crash 讓 /admin/* 回 500）。build 走 `nuxt build` 而非 `pnpm build`：後者前置的
#      scripts/check-env-contract.mjs 守的是「部署」的 22 個必要設定，e2e 一個都不需要，
#      而 CI=true 會讓它改讀 process.env → 必然缺項 → 整條 workflow 卡在 gate。

on:
  push:
    branches: [main]
    paths:
      - 'tests/e2e/auth/**'
      - 'app/plugins/auth.client.ts'
      - 'app/middleware/auth.ts'
      - 'app/middleware/role.ts'
      - 'app/stores/5.store-auth.ts'
      - 'app/protocol/fetch-api/methods.ts'
      - 'shared/auth/**'
      - 'shared/constants/auth-public-routes**'
      - 'app/composables/use-roles-load-guard.ts'
      - 'app/composables/use-liff-redirect-guard.ts'
      - 'app/layouts/front-desk.vue'
      - 'playwright.config.ts'
      - 'app/app.vue'
      - 'app/components/common/CommonBootGate.vue'
      - 'app/pages/orders/index.vue'
      - 'server/utils/security-headers.ts'
      - 'server/plugins/local-http-headers.ts'
      - '.github/workflows/e2e-auth.yml'
  pull_request:
    branches: [main]

jobs:
  auth-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          # CLAUDE.md 要求 Node >= 24.13.0
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        # 見檔頭 (c)：繞過 check-env-contract 的部署 gate，直接 nuxt build。
        # playwright.config 的 webServer 會起 .output/server/index.mjs。
        run: pnpm exec nuxt build

      - name: Install Playwright browsers
        # 三個 project：chromium / mobile-chrome（Pixel 5，仍是 chromium）/ iphone-14（WebKit）
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run auth e2e suite
        # webServer (playwright.config) 在 CI=true 時自動起 pnpm dev
        run: pnpm test:e2e:auth
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 14
